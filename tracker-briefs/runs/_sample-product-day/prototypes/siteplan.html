<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live-PMS Siteplan — sample vignette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #0c1222 0%, #162033 50%, #0f172a 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: clamp(12px, 3vw, 24px);
    }
    header { margin-bottom: 12px; }
    h1 { font-size: clamp(1rem, 2.5vw, 1.25rem); font-weight: 600; }
    .sub { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .map-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .map {
      flex: 1;
      min-height: 200px;
      background:
        radial-gradient(circle at 30% 40%, #1e4d7a44 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, #22c55e22 0%, transparent 40%),
        linear-gradient(135deg, #1e3a5f, #0f172a);
      border-radius: 12px;
      border: 1px solid #334155;
      position: relative;
      padding: 16px;
    }
    .building {
      position: absolute;
      border: 2px dashed #475569;
      border-radius: 8px;
      background: #1e293b66;
      font-size: 0.65rem;
      color: #64748b;
      padding: 4px 8px;
    }
    .b-a { top: 12%; left: 8%; width: 42%; height: 38%; }
    .b-b { top: 18%; right: 8%; width: 38%; height: 32%; }
    .b-c { bottom: 12%; left: 20%; width: 55%; height: 28%; }
    .units {
      position: absolute;
      inset: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
    }
    .unit {
      padding: 10px 14px;
      background: #22c55e28;
      border: 1px solid #22c55e;
      border-radius: 8px;
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      font-weight: 500;
      box-shadow: 0 4px 12px #00000044;
    }
    .unit.hot { background: #f59e0b33; border-color: #f59e0b; }
    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot.avail { background: #22c55e; }
    .dot.hold { background: #f59e0b; }
  </style>
</head>
<body>
  <header>
    <h1>Live-PMS Siteplan</h1>
    <p class="sub">Entrata counter — unit pins + live rent from PMS (not static PDF)</p>
  </header>
  <div class="map-wrap">
    <div class="map">
      <span class="building b-a">Building A</span>
      <span class="building b-b">Building B</span>
      <span class="building b-c">Building C</span>
      <div class="units">
        <span class="unit hot">204 · $1,845 · avail</span>
        <span class="unit">305 · $1,920</span>
        <span class="unit">112 · $1,710</span>
        <span class="unit">418 · $2,050</span>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot avail"></span>Available — live PMS</span>
      <span><span class="dot hold"></span>On hold</span>
    </div>
  </div>
</body>
</html>
