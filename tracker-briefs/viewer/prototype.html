<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype — Tracker Brief</title>
  <link rel="stylesheet" href="roi-styles.css" />
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #16161a;
      --text: #ececf1;
      --accent: #5b8def;
      --border: #2a2a32;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .btn-back {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .title { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      min-height: calc(100vh - 53px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .roi-column {
      padding: 16px;
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
    }
    .roi-column h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9b9ba7;
      margin: 0 0 12px;
    }
    .frame-wrap { background: #fff; min-height: 400px; }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 53px);
      min-height: 400px;
      border: none;
    }
    @media (max-width: 900px) {
      iframe { height: 50vh; }
      .roi-column { border-right: none; border-bottom: 1px solid var(--border); }
    }
    .err { padding: 24px; text-align: center; color: #f87171; }
  </style>
</head>
<body>
  <header>
    <a class="btn-back" id="back-link" href="index.html">← Back to Tracker Brief</a>
    <span class="title" id="proto-title"></span>
  </header>
  <div class="layout">
    <aside class="roi-column">
      <h2>ROI snapshot</h2>
      <div id="roi-panel"></div>
    </aside>
    <div class="frame-wrap">
      <iframe id="frame" title="Prototype"></iframe>
    </div>
  </div>
  <p class="err" id="err" hidden></p>
  <script src="roi-shared.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    const back = params.get('back');
    const title = params.get('title') || 'Prototype';
    const roi = parseRoiParam(params.get('roi'));

    document.getElementById('proto-title').textContent = title;
    if (back) document.getElementById('back-link').href = back;

    document.getElementById('roi-panel').innerHTML = renderRoiPanel(roi);

    if (!src) {
      document.querySelector('.layout').hidden = true;
      const err = document.getElementById('err');
      err.hidden = false;
      err.textContent = 'Missing prototype URL.';
    } else {
      const sep = src.includes('?') ? '&' : '?';
      document.getElementById('frame').src = src + sep + 'v=4';
    }
  </script>
</body>
</html>
