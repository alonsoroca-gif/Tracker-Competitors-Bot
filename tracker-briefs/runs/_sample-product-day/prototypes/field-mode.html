<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Field-mode vignette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .phone {
      width: 100%;
      max-width: 280px;
      border: 3px solid #52525b;
      border-radius: 22px;
      padding: 14px 12px;
      background: #27272a;
    }
    .tour-title { font-size: 0.85rem; font-weight: 600; color: #fafafa; margin-bottom: 4px; }
    .tour-meta { font-size: 0.72rem; color: #a1a1aa; margin-bottom: 10px; }
    button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 0.75rem;
      text-align: left;
    }
    button.secondary { background: #3f3f46; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="tour-title">Tour · Unit 204</div>
    <div class="tour-meta">Building A · $1,845/mo</div>
    <button>Capture photo → PMS</button>
    <button>Push apply link</button>
    <button class="secondary">Voice note</button>
  </div>
</body>
</html>
