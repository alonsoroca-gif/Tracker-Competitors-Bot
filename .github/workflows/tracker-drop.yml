# Collect → relevance gate → tracker-drops/ commit (+ optional Slack).
# See initiative-1-tracker/docs/TRACKER-DROP-CI.md and TRACKER-FLOW-END-TO-END.md §7.

name: Tracker drop

on:
  workflow_dispatch:
  schedule:
    # Weekdays (MT). Times are UTC; MDT (Mar–Nov) = MT, MST shifts −1h locally.
    # Morning collect @ 5:45am MT — fresh drop before Billy morningbrief kickoff ~8:00am.
    # See initiative-1-tracker/docs/TRACKER-AUTOMATION.md
    - cron: '45 11 * * 1-5'   # 5:45am MDT — morning collect (feeds publish)
    - cron: '0 18 * * 1-5'    # 12:00pm MDT — midday catch
    - cron: '0 23 * * 1-5'    # 5:00pm MDT — end-of-day (next-morning brief)

permissions:
  contents: write
  actions: write   # required for the explicit `gh workflow run auto-merge-agent.yml` dispatch step below

concurrency:
  group: tracker-drop
  cancel-in-progress: true

jobs:
  collect-and-drop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent/P1.1 (writer-staging branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/P1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tracker dependencies
        working-directory: initiative-1-tracker/tracker
        run: npm install

      - name: Install Playwright browsers (chromium only)
        working-directory: initiative-1-tracker/tracker
        # Adds ~30–45s and ~100 MB to the runner cache. Required for the
        # Playwright fallback in lib/collect.js (SPA pages where Cheerio sees
        # an empty body). --with-deps installs OS-level shared libs Chromium
        # needs on ubuntu-latest. Browsers land in the runner's default
        # ~/.cache/ms-playwright (NOT the workspace cache used locally).
        run: npx playwright install --with-deps chromium

      - name: Run collect + publish drop
        working-directory: initiative-1-tracker/tracker
        run: node scripts/publish-drop.js --days 7

      - name: Commit and push if tracker-drops changed
        id: gitpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker-drops
          if git diff --staged --quiet; then
            echo "No changes under tracker-drops (skipped commit)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "tracker drop: $(date -u +'%Y-%m-%dT%H%MZ')"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger auto-merge into main
        # GitHub suppresses downstream workflow triggers for pushes made by
        # the default GITHUB_TOKEN (loop-prevention guard). workflow_dispatch
        # is exempt from that rule, so we explicitly kick off the auto-merge
        # here to ensure CI drops reach main within ~30s.
        if: steps.gitpush.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto-merge-agent.yml

      - name: Slack — drop summary (optional)
        if: steps.gitpush.outputs.pushed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skip Slack."
            exit 0
          fi
          export DROP_COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"
          node initiative-1-tracker/tracker/scripts/slack-drop-notify.js
