<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live-PMS Siteplan — sample vignette</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
    .map { height: 280px; background: linear-gradient(135deg, #1e3a5f, #0f172a); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; }
    .unit { display: inline-block; margin: 4px; padding: 8px 12px; background: #22c55e33; border: 1px solid #22c55e; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Live-PMS Siteplan</h1>
  <p>Sample prototype — unit pins show live rent from Entrata PMS.</p>
  <div class="map">
    <div>
      <span class="unit">Unit 204 · $1,845</span>
      <span class="unit">Unit 305 · $1,920</span>
      <span class="unit">Unit 112 · $1,710</span>
    </div>
  </div>
</body>
</html>
