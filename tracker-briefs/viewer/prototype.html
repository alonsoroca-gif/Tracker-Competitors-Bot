<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype — Tracker Brief</title>
  <link rel="stylesheet" href="roi-styles.css?v=roi-v8" />
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #16161a;
      --text: #ececf1;
      --muted: #9b9ba7;
      --accent: #5b8def;
      --border: #2a2a32;
      --proto-h: 340px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .btn-back {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .title { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .proto-stage {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #0a0a0c;
      flex-shrink: 0;
    }
    .proto-stage-label {
      padding: 8px 14px;
      font-size: 0.72rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .frame-wrap {
      height: var(--proto-h);
      background: #0a0a0c;
    }
    iframe {
      display: block;
      width: 100%;
      height: var(--proto-h);
      border: none;
      background: #18181b;
    }
    .err { padding: 24px; text-align: center; color: #f87171; }
  </style>
</head>
<body>
  <header>
    <a class="btn-back" id="back-link" href="index.html">← Back to Tracker Brief</a>
    <span class="title" id="proto-title"></span>
  </header>
  <main class="page" id="page">
    <section id="roi-section">
      <h2 class="section-label">ROI snapshot</h2>
      <div id="roi-panel"><p class="roi-empty">Loading ROI…</p></div>
    </section>
    <section id="brief-section">
      <h2 class="section-label">Prototype brief</h2>
      <div id="proto-brief"><p class="roi-empty">Loading brief…</p></div>
    </section>
    <section class="proto-stage" aria-label="Prototype vignette">
      <div class="proto-stage-label">Prototype preview</div>
      <div class="frame-wrap">
        <iframe id="frame" title="Prototype vignette"></iframe>
      </div>
    </section>
  </main>
  <p class="err" id="err" hidden></p>
  <script src="roi-shared.js?v=roi-v8"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    const back = params.get('back');
    const title = params.get('title') || 'Prototype';
    const runId = params.get('run');
    const protoId = params.get('id');

    document.getElementById('proto-title').textContent = title;
    if (back) document.getElementById('back-link').href = back;

    async function loadContext() {
      let proto = null;
      if (runId && protoId) {
        try {
          const protos = await fetchPrototypesForRun(runId);
          proto = findProtoById(protos, protoId);
        } catch {
          /* fall through */
        }
      }
      const roi = proto?.roi ?? parseRoiParam(params.get('roi'));
      document.getElementById('roi-panel').innerHTML = renderRoiPanel(roi, { includeBrief: true });
      document.getElementById('proto-brief').innerHTML = renderProtoBrief(proto || { title });
    }

    if (!src) {
      document.getElementById('page').hidden = true;
      const err = document.getElementById('err');
      err.hidden = false;
      err.textContent = 'Missing prototype URL.';
    } else {
      const sep = src.includes('?') ? '&' : '?';
      document.getElementById('frame').src = src + sep + 'v=roi-v8';
      loadContext();
    }
  </script>
</body>
</html>
