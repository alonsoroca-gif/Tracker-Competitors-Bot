<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRD — Tracker Brief</title>
  <style>
    /* Light "document" theme — matches tracker-decks/PRD-*.html so the on-screen
       PRD and the printed PDF are the same artifact. Download = browser print. */
    :root {
      --ink: #1a1a1a;
      --muted: #666;
      --accent: #c0392b;
      --rule: #ccc;
      --code-bg: #f4f4f4;
    }
    * { box-sizing: border-box; }
    html, body { background: #5a5a5f; }
    body {
      margin: 0;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      line-height: 1.5;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(20, 20, 24, 0.96);
      border-bottom: 1px solid #2a2a32;
    }
    .btn-back, .btn-pdf {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #3a3a44;
      background: #16161a;
      color: #ececf1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-pdf { border-color: #5b8def; color: #9dbcff; }
    .btn-back:hover, .btn-pdf:hover { background: #21212a; }
    .status {
      width: 100%;
      text-align: center;
      font-size: 0.82rem;
      color: #9b9ba7;
      min-height: 1.2em;
    }
    /* The printable page — a letter-width white sheet centered on the dark chrome. */
    .sheet {
      max-width: 7.5in;
      margin: 28px auto 56px;
      padding: 0.75in;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
    }
    #content h1 {
      font-size: 21px;
      margin: 0 0 6px 0;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 6px;
      line-height: 1.25;
    }
    #content h2 {
      font-size: 14px;
      margin: 18px 0 4px 0;
      color: var(--accent);
      text-transform: none;
    }
    #content h3 { font-size: 12.5px; margin: 12px 0 4px; }
    #content p { margin: 5px 0; font-size: 13px; }
    #content ul { margin: 4px 0 8px 20px; padding: 0; }
    #content li { margin-bottom: 4px; font-size: 13px; }
    #content code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.86em;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 3px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #content strong { font-weight: 700; }
    .meta { font-size: 11px; color: var(--muted); margin: 8px 0 16px; }
    .pill {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 9px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      vertical-align: middle;
      /* Keep pill fills when saving to PDF (browsers drop backgrounds otherwise). */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .pill-now { background: #27ae60; }
    .pill-s { background: #16a085; }
    .pill-m { background: #e67e22; }
    .pill-l { background: #c0392b; }
    .pill-xl { background: #8e44ad; }
    .doc-footer {
      margin-top: 22px;
      padding-top: 8px;
      border-top: 1px solid var(--rule);
      font-size: 10.5px;
      color: #888;
    }
    .loading, .err { text-align: center; padding: 48px 24px; color: var(--muted); }
    .err { color: #c0392b; }

    @media print {
      html, body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet {
        max-width: none;
        margin: 0;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
      }
    }
    @page { size: Letter; margin: 0.75in; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn-back" id="back-link" href="index.html">← Back to Tracker Brief</a>
    <button type="button" class="btn-pdf" id="pdf-btn">Download PDF (Save as PDF)</button>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <main class="sheet">
    <div id="content" class="loading">Loading PRD…</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    const back = params.get('back');

    if (back) document.getElementById('back-link').href = back;

    function setStatus(msg, isErr) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = isErr ? '#f87171' : '#9b9ba7';
    }

    // Inline markdown: escape HTML first, then apply code / bold / italic.
    function inline(s) {
      let t = String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
      t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return t;
    }

    /**
     * Renders the tracker PRD markdown shape:
     *   #### PRD: <title>            → <h1>
     *   - **Field:** value           → <h2>Field</h2> + <p>value</p>
     *   <indent>- sub-bullet         → <li> under the field's <ul>
     *   ## / ### headers             → <h2>/<h3>  (polished-format compatibility)
     */
    function mdToHtml(md) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let inList = false;
      const openList = () => { if (!inList) { out.push('<ul>'); inList = true; } };
      const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };

      for (const raw of lines) {
        const line = raw.replace(/\s+$/, '');
        let m;
        if (line.trim() === '') { closeList(); continue; }

        if ((m = line.match(/^#{4,6}\s+(.+)/))) { closeList(); out.push(`<h1>${inline(m[1])}</h1>`); continue; }
        if ((m = line.match(/^#\s+(.+)/))) { closeList(); out.push(`<h1>${inline(m[1])}</h1>`); continue; }
        if ((m = line.match(/^##\s+(.+)/))) { closeList(); out.push(`<h2>${inline(m[1])}</h2>`); continue; }
        if ((m = line.match(/^###\s+(.+)/))) { closeList(); out.push(`<h3>${inline(m[1])}</h3>`); continue; }

        // Indented sub-bullet → list item under the current section.
        if ((m = line.match(/^\s{2,}[-*]\s+(.+)/))) { openList(); out.push(`<li>${inline(m[1])}</li>`); continue; }

        // Top-level field bullet: - **Label:** optional value
        if ((m = line.match(/^[-*]\s+\*\*(.+?):\*\*\s*(.*)$/))) {
          closeList();
          out.push(`<h2>${inline(m[1])}</h2>`);
          if (m[2] && m[2].trim()) out.push(`<p>${inline(m[2])}</p>`);
          continue;
        }

        // Generic top-level bullet.
        if ((m = line.match(/^[-*]\s+(.+)/))) { openList(); out.push(`<li>${inline(m[1])}</li>`); continue; }

        closeList();
        out.push(`<p>${inline(line.trim())}</p>`);
      }
      closeList();
      return out.join('\n');
    }

    // Tier/effort pills + drop code, mirroring the tracker-decks meta line.
    function metaHtml(md) {
      const parts = [];
      const dm = (src || '').match(/runs\/([^/]+)\//);
      if (dm) parts.push(`Drop: <code>${dm[1]}</code>`);
      // Brief PRDs are produced only for Tier — Now features.
      parts.push('Tier <span class="pill pill-now">Now</span>');
      const em = md.match(/^[-*]\s+\*\*Effort estimate:\*\*\s*(XL|L|M|S)\b/im);
      if (em) {
        const e = em[1].toUpperCase();
        parts.push(`Effort <span class="pill pill-${e.toLowerCase()}">${e}</span>`);
      }
      return parts.join(' &middot; ');
    }

    function downloadPdf() {
      if (!document.querySelector('#content h1, #content h2')) {
        setStatus('PDF not ready — wait for PRD to load.', true);
        return;
      }
      setStatus('Opening print dialog — choose “Save as PDF”.');
      window.print();
    }

    document.getElementById('pdf-btn').addEventListener('click', downloadPdf);

    async function load() {
      const el = document.getElementById('content');
      if (!src) {
        el.className = 'err';
        el.textContent = 'Missing PRD path.';
        return;
      }
      try {
        const res = await fetch(src);
        if (!res.ok) throw new Error(`${res.status}`);
        const md = await res.text();
        el.className = '';
        el.innerHTML = mdToHtml(md);

        const h1 = el.querySelector('h1');
        if (h1) {
          document.title = h1.textContent || 'PRD — Tracker Brief';
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.innerHTML = metaHtml(md);
          h1.insertAdjacentElement('afterend', meta);
        }

        const footer = document.createElement('div');
        footer.className = 'doc-footer';
        footer.textContent = 'Generated by tracker-drop-cycle skill · Tracker Competitors Bot';
        el.appendChild(footer);
      } catch (e) {
        el.className = 'err';
        el.textContent = `Failed to load PRD: ${e.message}`;
      }
    }

    load();
  </script>
</body>
</html>
