<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siteplan vignette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3a5f, #0f172a);
      padding: 10px;
      display: flex;
      align-items: stretch;
    }
    .map {
      flex: 1;
      border-radius: 10px;
      border: 1px solid #334155;
      position: relative;
      min-height: 180px;
      background:
        radial-gradient(circle at 30% 40%, #1e4d7a44 0%, transparent 50%),
        #0f172a;
    }
    .building {
      position: absolute;
      border: 2px dashed #475569;
      border-radius: 6px;
      font-size: 0.6rem;
      color: #64748b;
      padding: 3px 6px;
    }
    .b-a { top: 10%; left: 6%; width: 40%; height: 36%; }
    .b-b { top: 14%; right: 6%; width: 36%; height: 30%; }
    .units {
      position: absolute;
      inset: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 6px;
      padding: 16px;
    }
    .unit {
      padding: 8px 10px;
      background: #22c55e28;
      border: 1px solid #22c55e;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #e2e8f0;
    }
    .unit.hot { background: #f59e0b33; border-color: #f59e0b; }
  </style>
</head>
<body>
  <div class="map">
    <span class="building b-a">Bldg A</span>
    <span class="building b-b">Bldg B</span>
    <div class="units">
      <span class="unit hot">204 · $1,845</span>
      <span class="unit">305 · $1,920</span>
      <span class="unit">112 · $1,710</span>
    </div>
  </div>
</body>
</html>
