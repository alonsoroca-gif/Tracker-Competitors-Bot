<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracker Brief Viewer</title>
  <!-- viewer-build: 2026-06-10-responsive-v11 -->
  <link rel="stylesheet" href="roi-styles.css?v=roi-v19" />
  <script src="roi-shared.js?v=roi-v19"></script>
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #16161a;
      --text: #ececf1;
      --muted: #9b9ba7;
      --accent: #5b8def;
      --border: #2a2a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(12, 12, 15, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 0.85rem; }
    select, button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    html, body { overflow-x: hidden; max-width: 100vw; }
    main {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: clamp(12px, 2vw, 24px);
    }
    section { margin-bottom: clamp(20px, 3vw, 32px); }
    h2 { font-size: clamp(0.95rem, 1.1vw, 1.1rem); margin: 0 0 10px; }
    /* Signals — fit pane width, no horizontal scroll (container queries: Simple Browser split pane ≠ viewport) */
    #table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      container-type: inline-size;
      container-name: signals-pane;
    }
    .signals-table-wrap table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: clamp(0.72rem, 0.85vw + 0.4rem, 0.88rem);
    }
    .signals-table-wrap th,
    .signals-table-wrap td {
      border: 1px solid var(--border);
      padding: clamp(6px, 0.8vw, 10px) clamp(6px, 0.9vw, 11px);
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .signals-table-wrap th {
      background: var(--panel);
      color: var(--muted);
      font-weight: 500;
      font-size: clamp(0.68rem, 0.75vw + 0.35rem, 0.8rem);
    }
    .signals-table-wrap .col-id { width: 3%; }
    .signals-table-wrap .col-competitor { width: 11%; }
    .signals-table-wrap .col-headline { width: 16%; }
    .signals-table-wrap .col-class { width: 12%; }
    .signals-table-wrap .col-parity { width: 8%; }
    .signals-table-wrap .col-routing { width: 9%; }
    .signals-table-wrap .col-why { width: 34%; }
    .signals-table-wrap .col-source { width: 7%; }
    .signals-table-wrap .col-source a {
      color: var(--accent);
      font-size: 0.78em;
      word-break: normal;
    }
    /* Default: table on; cards off. Queries below must come AFTER this rule. */
    .signals-cards { display: none; }
    /* Hide lower-priority columns as the viewer pane narrows (not window width) */
    @container signals-pane (max-width: 1280px) {
      .signals-table-wrap .col-source { display: none; }
    }
    @container signals-pane (max-width: 1024px) {
      .signals-table-wrap .col-parity { display: none; }
    }
    @container signals-pane (max-width: 900px) {
      .signals-table-wrap { display: none; }
      .signals-cards { display: block; }
    }
    /* Viewport fallback when container queries unsupported */
    @media (max-width: 900px) {
      .signals-table-wrap { display: none; }
      .signals-cards { display: block; }
    }
    .signal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: clamp(10px, 1.5vw, 14px);
      margin-bottom: 10px;
    }
    .signal-card:last-child { margin-bottom: 0; }
    .signal-card-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .signal-card-head strong { font-size: 0.95em; }
    .signal-card-head .badge {
      font-size: 0.72em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .signal-card dl {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(5rem, 28%) 1fr;
      gap: 4px 10px;
      font-size: clamp(0.72rem, 0.85vw + 0.35rem, 0.85rem);
    }
    .signal-card dt {
      margin: 0;
      color: var(--muted);
      font-weight: 500;
    }
    .signal-card dd { margin: 0; word-break: break-word; }
    .signal-card dd a { color: var(--accent); }
    .proto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: clamp(16px, 2vw, 24px);
      width: 100%;
    }
    /* Fill row width — 2 cards = 50/50, 3 = thirds */
    .proto-grid--1 { grid-template-columns: 1fr; }
    .proto-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .proto-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 960px) {
      .proto-grid--2,
      .proto-grid--3 { grid-template-columns: 1fr; }
    }
    .proto-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }
    .proto-card header {
      position: static;
      border: none;
      padding: 12px 14px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .proto-roi-section {
      padding: 0 14px 12px;
      flex-shrink: 0;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .proto-roi-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .demo-hint {
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: rgba(91, 141, 239, 0.1);
      font-size: 0.88rem;
    }
    .demo-hint a { color: var(--accent); font-weight: 600; }
    .proto-preview-wrap {
      display: block;
      position: relative;
      flex-shrink: 0;
      isolation: isolate;
      z-index: 1;
      border-top: 1px solid var(--border);
      background: #0a0a0c;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .proto-preview-wrap:hover .proto-open-hint { color: var(--accent); }
    .proto-card iframe {
      display: block;
      width: 100%;
      height: 280px;
      border: none;
      background: #18181b;
      pointer-events: none;
    }
    .proto-open-hint {
      display: block;
      padding: 8px 14px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    .proto-card .links {
      padding: 12px 14px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: stretch;
      margin-top: auto;
    }
    .proto-card .links .btn-proto,
    .proto-card .links .btn-prd {
      flex: 1 1 auto;
      text-align: center;
      min-width: 10rem;
    }
    .btn-proto, .btn-prd {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
    }
    .btn-proto:hover, .btn-prd:hover {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.12);
    }
    .btn-prd {
      border-color: var(--accent);
      color: var(--accent);
    }
    .empty { color: var(--muted); font-style: italic; }
    .err { color: #f87171; padding: 12px; background: #1a1010; border-radius: 8px; }
    .carryover { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px; grid-column: 1 / -1; }
    .carryover > summary {
      cursor: pointer; color: var(--muted); font-size: 13px; list-style: none;
      user-select: none; padding: 4px 0;
    }
    .carryover > summary:hover { color: var(--fg); }
    .carryover > summary::before { content: '▸ '; }
    .carryover[open] > summary::before { content: '▾ '; }
    .carryover-proto { margin: 8px 0 0; padding: 0; list-style: none; }
    .carryover-proto li {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .carryover-proto .meta { color: var(--muted); }
    .carryover-proto a { color: var(--accent); font-weight: 600; }
    .muted { color: var(--muted); }
    .dedup-note { font-size: 13px; font-style: italic; margin-top: 10px; }
    .change-detail { color: var(--muted); font-size: 12px; margin-top: 4px; }
    td .change-detail { display: block; }
    .routing-lead { font-size: 13px; }
    .routing-detail { color: var(--muted); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Tracker Brief Viewer</h1>
    <span class="meta" id="run-meta">Loading…</span>
    <span class="meta" title="Hard-refresh if layout looks stale">viewer roi-v19</span>
    <select id="run-select" aria-label="Select run"></select>
    <button type="button" id="reload-btn">Reload</button>
  </header>
  <main>
    <section id="summary-section">
      <h2>Summary</h2>
      <p id="summary-text" class="meta">—</p>
    </section>
    <section id="table-section">
      <h2>Signals</h2>
      <p class="meta" style="margin:0 0 10px;font-size:0.82rem;">Full table on wide panes · stacked cards when the Simple Browser pane is narrow.</p>
      <div id="table-wrap"></div>
    </section>
    <section id="prototypes-section">
      <h2>Prototypes</h2>
      <div id="prototypes" class="proto-grid"></div>
    </section>
  </main>
  <script>
    // viewer/ is one level below tracker-briefs/ — data + runs live under ../
    const BRIEF_PREFIX = '../';

    /** Paths in JSON are repo-relative (tracker-briefs/runs/...); resolve for viewer/. */
    function assetUrl(storedPath) {
      if (!storedPath) return '';
      const p = String(storedPath).replace(/^tracker-briefs\//, '');
      return BRIEF_PREFIX + p;
    }

    /** Full localhost URL for opening prototype / PRD in a new tab. */
    function absoluteAssetUrl(storedPath) {
      const rel = assetUrl(storedPath);
      if (!rel) return '';
      return new URL(rel, window.location.href).href;
    }

    function viewerShellUrl(shellPage, assetPath, title, runId, protoId) {
      const back = encodeURIComponent(window.location.href);
      const src = encodeURIComponent(assetUrl(assetPath));
      let url = `${shellPage}?src=${src}&back=${back}`;
      if (title) url += `&title=${encodeURIComponent(title)}`;
      if (runId) url += `&run=${encodeURIComponent(runId)}`;
      if (protoId) url += `&id=${encodeURIComponent(protoId)}`;
      return url;
    }

    function qp(name) {
      return new URLSearchParams(location.search).get(name);
    }

    async function fetchJson(path) {
      const url = new URL(path, window.location.href);
      url.searchParams.set('v', typeof VIEWER_BUILD !== 'undefined' ? VIEWER_BUILD : 'roi-v19');
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${path} → ${res.status}`);
      return res.json();
    }

    function esc(s) {
      return String(s ?? '—').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function classLabel(r) {
      if (r.classification_detail) {
        return `${r.classification} / ${r.classification_detail}`;
      }
      return r.classification ?? '—';
    }

    function parityLabel(r) {
      const l2 = r.parity_l2 ?? r.parity ?? '—';
      const l1 = r.parity_l1;
      if (l1 && l1 !== l2 && l2 !== '—') return `${l2} · L1 ${l1}`;
      return l2;
    }

    function sourceLink(url) {
      if (!url) return '—';
      return `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">Open ↗</a>`;
    }

    // Lead with the plain-English verdict + reason (straight answer to "why are
    // we chasing / not chasing this?"), then keep the dense L1/L2 parity
    // rationale as smaller secondary text below it.
    function routingCell(r) {
      // For Product rows, the honest "why" AFTER the Core parity scan is the
      // parity verdict itself. The stored routing_reason is stamped at classify
      // time (pre-parity) and goes stale ("needs Core parity scan"), so derive
      // the lead from the actual verdict here — render-time truth can't drift.
      const parity = String(r.parity_l2 || r.parity || '').toLowerCase();
      const scanned = parity && parity !== '—' && parity !== 'not_scanned';
      let reason = '';
      if (r.classification === 'Product' && scanned) {
        reason = parity === 'gap'
          ? 'Core gap — net-new build if promoted to Tier-Now.'
          : parity === 'partial'
            ? 'Partial in Core — only the delta is net-new.'
            : parity === 'existing'
              ? 'Core already ships this — won’t chase.'
              : `Core parity: ${r.parity_l2 || r.parity}.`;
      } else if (r.routing_reason && r.routing_reason !== r.why_routing) {
        reason = r.routing_reason;
      }
      const lead = reason
        ? `<div class="routing-lead"><strong>${esc(r.routing)}</strong> — ${esc(reason)}</div>`
        : `<div class="routing-lead"><strong>${esc(r.routing)}</strong></div>`;
      const detailText = r.why_routing || r.signal_summary;
      const detail = detailText ? `<div class="routing-detail">${esc(detailText)}</div>` : '';
      return lead + detail;
    }

    function renderSignalCards(rows) {
      if (!rows.length) return '';
      // Number sequentially (1..n) for the SHOWN set — the raw signals-table id
      // skips hidden rows, which is why the list used to start at #6.
      return rows.map((r, i) => `
        <article class="signal-card">
          <div class="signal-card-head">
            <strong>#${i + 1} · ${esc(r.competitor)}</strong>
            ${r.change_status === 'new' ? '<span class="badge">new</span>' : ''}
            ${r.change_status === 'changed' && r.change_significance ? `<span class="badge">changed · ${esc(r.change_significance)}</span>` : ''}
            <span class="badge">${esc(classLabel(r))}</span>
            ${r.routing ? `<span class="badge">${esc(r.routing)}</span>` : ''}
            ${parityLabel(r) !== '—' ? `<span class="badge">Parity ${esc(parityLabel(r))}</span>` : ''}
          </div>
          <dl>
            <dt>Headline</dt><dd>${esc(r.headline)}</dd>
            ${r.change_status === 'changed' && r.change_detail ? `<dt>What changed</dt><dd class="change-detail">${esc(r.change_detail)}</dd>` : ''}
            <dt>Why / routing</dt><dd>${routingCell(r)}</dd>
            ${r.source_url ? `<dt>Source</dt><dd>${sourceLink(r.source_url)}</dd>` : ''}
          </dl>
        </article>
      `).join('');
    }

    function renderTable(rows) {
      if (!rows.length) {
        return '<p class="empty">No signal rows.</p>';
      }
      const head = `
        <colgroup>
          <col class="col-id" /><col class="col-competitor" /><col class="col-headline" />
          <col class="col-class" /><col class="col-parity" /><col class="col-routing" />
          <col class="col-why" /><col class="col-source" />
        </colgroup>
        <thead><tr>
          <th class="col-id">#</th>
          <th class="col-competitor">Competitor</th>
          <th class="col-headline">Headline</th>
          <th class="col-class">Classification</th>
          <th class="col-parity">Parity</th>
          <th class="col-routing">Routing</th>
          <th class="col-why">Why / routing</th>
          <th class="col-source">Source</th>
        </tr></thead>`;
      const body = rows.map((r, i) => `
        <tr>
          <td class="col-id">${i + 1}</td>
          <td class="col-competitor">${esc(r.competitor)}</td>
          <td class="col-headline">${esc(r.headline)}${r.change_status === 'changed' && r.change_detail ? `<div class="change-detail">↳ what changed: ${esc(r.change_detail)}</div>` : ''}</td>
          <td class="col-class">${esc(classLabel(r))}</td>
          <td class="col-parity">${esc(parityLabel(r))}</td>
          <td class="col-routing">${esc(r.routing)}</td>
          <td class="col-why">${routingCell(r)}</td>
          <td class="col-source">${sourceLink(r.source_url)}</td>
        </tr>
      `).join('');
      return `<div class="signals-table-wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
    }

    function renderSignals(rows) {
      if (!rows.length) return '<p class="empty">No signal rows.</p>';
      return `${renderTable(rows)}<div class="signals-cards">${renderSignalCards(rows)}</div>`;
    }

    // Why the significance gate kept a row out of Billy's brief — surfaced so the
    // supervisor (you) can audit that the gate is classifying correctly.
    function suppressionReason(r) {
      if (r.change_status === 'unchanged') {
        // Byte-identical to a prior brief → there is no diff. Prove it instead:
        // cite when this exact content first appeared and the fingerprint matched.
        const since = r.first_seen_run ? ` (first published ${String(r.first_seen_run).slice(0, 10)})` : '';
        const fp = r.unchanged_hash ? ` · body fingerprint ${String(r.unchanged_hash).slice(0, 8)} unchanged` : '';
        return `unchanged — byte-identical to a prior brief${since}; no minimal change to show${fp}`;
      }
      if (r.change_status === 'changed' && r.change_significance === 'trivial') {
        const why = Array.isArray(r.significance_reasons) && r.significance_reasons.length
          ? r.significance_reasons.join(', ')
          : 'low-signal';
        const score = Number.isFinite(r.significance_score) ? ` (score ${r.significance_score} < 20)` : '';
        return `minimal change (hidden from Billy) — ${why}${score}`;
      }
      return r.change_status || '';
    }

    function renderCarryoverSignals(rows) {
      if (!rows.length) return '';
      const items = rows.map((r) => {
        // When the reason is a (suppressed) minimal change, show the actual diff
        // the gate scored — this is the "what changed" the supervisor needs.
        const detail = (r.change_status === 'changed' && r.change_detail)
          ? `<span class="meta change-detail">↳ what changed: ${esc(r.change_detail)}</span>`
          : '';
        return `
        <li>
          ${r.source_url ? `<a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.competitor)}</a>` : `<span>${esc(r.competitor)}</span>`}
          <span>${esc(r.headline)}</span>
          <span class="meta">${esc(suppressionReason(r))}</span>
          ${detail}
        </li>
      `;
      }).join('');
      return `<details class="carryover"><summary>${rows.length} minimal change(s) below Billy’s threshold — click to expand (hidden from Billy)</summary><ul class="carryover-proto" style="max-height:340px;overflow:auto">${items}</ul></details>`;
    }

    // A prototype shows once. Once shipped, it does not re-appear unless its
    // source signal changed (which changes the prototype content). Unchanged
    // carry-forwards collapse to a single count line — never re-listed.
    function renderCarryoverProtos(protos) {
      if (!protos.length) return '';
      return `<p class="muted dedup-note">${protos.length} prototype(s) hidden — already shipped, source unchanged.</p>`;
    }

    function renderPrototypes(protos, manifest, runId, hiddenProtos) {
      const el = document.getElementById('prototypes');
      protos = normalizePrototypes(protos);
      const hidden = normalizePrototypes(hiddenProtos || []);
      if (!protos.length) {
        const isPmm = (manifest?.product_row_count ?? manifest?.prototype_count ?? 0) === 0;
        el.className = '';
        const head = hidden.length
          ? `<p class="empty">No new prototypes today.</p>`
          : `<p class="empty">No prototypes this run${isPmm ? ' (PMM-only day)' : ''}.</p>
          <p class="demo-hint">
            Prototypes and <strong>ROI</strong> appear on Product signal days.
            <a href="?run=_sample-product-day">Open Product-day demo</a> to preview what Billy sees when there are Tier — Now Product rows.
          </p>`;
        el.innerHTML = head + renderCarryoverProtos(hidden);
        return;
      }
      el.className = 'proto-grid';
      if (protos.length >= 1 && protos.length <= 3) {
        el.classList.add(`proto-grid--${protos.length}`);
      }
      el.innerHTML = '';
      protos.forEach((p) => {
        const htmlPath = p.preview_path || p.html_path || '';
        const src = assetUrl(htmlPath) + '?v=roi-v19';
        const protoShell = viewerShellUrl('prototype.html', htmlPath, p.title, runId, p.id);
        const prdShell = p.prd_path
          ? `prd.html?src=${encodeURIComponent(assetUrl(p.prd_path))}&back=${encodeURIComponent(window.location.href)}`
          : '';

        const card = document.createElement('article');
        card.className = 'proto-card';

        const head = document.createElement('header');
        head.innerHTML = `<strong>${esc(p.title)}</strong><span class="meta">${esc(p.competitor || p.competitor_id)}</span>`;

        const roiSection = document.createElement('div');
        roiSection.className = 'proto-roi-section';
        roiSection.innerHTML = '<div class="proto-roi-label">ROI snapshot</div>';
        roiSection.insertAdjacentHTML('beforeend', renderRoiPanel(p.roi, { metricsOnly: true }));

        const previewWrap = document.createElement('div');
        previewWrap.className = 'proto-preview-wrap';
        previewWrap.title = 'Open prototype + ROI full screen';
        previewWrap.addEventListener('click', () => window.open(protoShell, '_blank', 'noopener'));
        previewWrap.setAttribute('role', 'button');
        previewWrap.setAttribute('tabindex', '0');
        previewWrap.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            window.open(protoShell, '_blank', 'noopener');
          }
        });
        const iframe = document.createElement('iframe');
        iframe.src = src;
        iframe.title = p.title || 'Prototype';
        iframe.loading = 'lazy';
        iframe.setAttribute('tabindex', '-1');
        const hint = document.createElement('span');
        hint.className = 'proto-open-hint';
        hint.textContent = 'Open prototype + ROI full screen';
        previewWrap.appendChild(iframe);
        previewWrap.appendChild(hint);

        const links = document.createElement('div');
        links.className = 'links';
        const btnProto = document.createElement('a');
        btnProto.className = 'btn-proto';
        btnProto.href = protoShell;
        btnProto.target = '_blank';
        btnProto.rel = 'noopener';
        btnProto.textContent = 'Open prototype';
        links.appendChild(btnProto);
        if (prdShell) {
          const btnPrd = document.createElement('a');
          btnPrd.className = 'btn-prd';
          btnPrd.href = prdShell;
          btnPrd.target = '_blank';
          btnPrd.rel = 'noopener';
          btnPrd.textContent = 'View / download PRD';
          links.appendChild(btnPrd);
        }

        card.append(head, roiSection, previewWrap, links);
        el.appendChild(card);
      });
      if (hidden.length) el.insertAdjacentHTML('beforeend', renderCarryoverProtos(hidden));
    }

    async function loadRun(runId) {
      const base = `${BRIEF_PREFIX}runs/${runId}/`;
      const [manifest, table, protosRaw, ann] = await Promise.all([
        fetchJson(base + 'manifest.json'),
        fetchJson(base + 'signals-table.json'),
        fetchJson(base + 'prototypes.json').catch(() => []),
        fetchJson(base + 'viewer-annotations.json').catch(() => null),
      ]);

      // Prefer the feed's new/changed/unchanged classification so unchanged
      // carryover is hidden by default (matches the chat feed). Older runs that
      // predate the annotation file fall back to showing every row.
      const sigSource = (ann && Array.isArray(ann.signals) && ann.signals.length) ? ann.signals : table;
      const sigAnnotated = sigSource.some((r) => r.change_status);
      const isTrivial = (r) => r.change_status === 'changed' && r.change_significance === 'trivial';
      // Supervisor (this viewer) sees ANY change, even minimal: new + every changed
      // tier. Truly unchanged rows (byte-identical to a prior brief) are dropped —
      // if nothing changed, it is not shown. Billy's chat feed keeps the stricter
      // rule (trivial hidden) in briefFeed.js.
      const shownSig = sigAnnotated
        ? sigSource.filter((r) => r.change_status === 'new' || (r.change_status === 'changed' && !isTrivial(r)))
        : sigSource;
      const minimalSig = sigAnnotated ? sigSource.filter(isTrivial) : [];
      const unchangedCount = sigAnnotated
        ? sigSource.filter((r) => r.change_status === 'unchanged').length
        : 0;
      const sigHtml = shownSig.length
        ? renderSignals(shownSig)
        : `<p class="empty">No new or materially-changed signals today.</p>`;
      const dedupNote = unchangedCount
        ? `<p class="muted dedup-note">${unchangedCount} unchanged page(s) deduped — byte-identical to a prior brief, hidden.</p>`
        : '';
      document.getElementById('table-wrap').innerHTML = sigHtml + renderCarryoverSignals(minimalSig) + dedupNote;

      const protoSource = (ann && Array.isArray(ann.prototypes) && ann.prototypes.length) ? ann.prototypes : protosRaw;
      const protoAnnotated = protoSource.some((p) => 'carried_over' in p);
      const shownProto = protoAnnotated ? protoSource.filter((p) => !p.carried_over || p.changed) : protoSource;
      const hiddenProto = protoAnnotated ? protoSource.filter((p) => p.carried_over && !p.changed) : [];

      // Accurate, de-confusing summary. The manifest's "net-new URLs" counts URLs
      // re-checked against the prior brief — NOT new signals. That mismatch is why
      // "13 net-new" sat above only 3 shown rows. Show the classified split instead.
      const newCount = shownSig.filter((r) => r.change_status === 'new').length;
      const changedShown = shownSig.filter((r) => r.change_status === 'changed').length;
      document.getElementById('run-meta').textContent =
        `${manifest.run_id} · ${newCount} new · ${changedShown} changed · ${minimalSig.length} minimal · ${unchangedCount} unchanged`;
      document.getElementById('summary-text').textContent =
        `${manifest.net_new_count ?? 0} URL(s) re-checked vs the prior brief → ${newCount} new · ${changedShown} changed (shown) · ${minimalSig.length} minimal (below Billy’s threshold) · ${unchangedCount} unchanged (deduped). ${shownProto.length} prototype(s) shown.`;

      renderPrototypes(shownProto, manifest, runId, hiddenProto);
    }

    function ensureRoiLib() {
      if (typeof renderRoiPanel !== 'function' || typeof normalizePrototypes !== 'function') {
        throw new Error('roi-shared.js failed to load — hard-refresh (Cmd+Shift+R).');
      }
    }

    async function init() {
      ensureRoiLib();
      try {
        const latest = await fetchJson(BRIEF_PREFIX + 'latest.json');
        const runParam = qp('run') || latest.run_id;
        const select = document.getElementById('run-select');
        let runs = [];
        try {
          const idx = await fetchJson(BRIEF_PREFIX + 'runs-index.json');
          runs = idx.runs || [];
        } catch {
          runs = [{ run_id: runParam }];
        }
        if (!runs.some((r) => r.run_id === runParam)) {
          runs.unshift({ run_id: runParam, net_new_count: latest.net_new_count, prototype_count: latest.prototype_count });
        }
        select.innerHTML = runs.map((r) => {
          const label = r.fixture ? `${r.run_id} (demo)` : r.run_id;
          const meta = `${r.net_new_count ?? '?'} net-new · ${r.prototype_count ?? 0} proto`;
          return `<option value="${esc(r.run_id)}"${r.run_id === runParam ? ' selected' : ''}>${esc(label)} — ${esc(meta)}</option>`;
        }).join('');
        select.onchange = () => {
          const id = select.value;
          const url = new URL(location.href);
          url.searchParams.set('run', id);
          history.replaceState(null, '', url);
          loadRun(id);
        };
        await loadRun(runParam);
        document.getElementById('reload-btn').onclick = () => loadRun(select.value || runParam);
      } catch (err) {
        document.getElementById('summary-text').innerHTML =
          `<span class="err">Failed to load brief: ${esc(err.message)}. Start <code>python3 -m http.server 8765</code> from repo root, then Simple Browser → <code>http://localhost:8765/tracker-briefs/viewer/index.html</code> (not the editor tab).</span>`;
      }
    }

    init();
  </script>
</body>
