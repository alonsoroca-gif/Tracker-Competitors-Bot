<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracker Brief Viewer</title>
  <!-- viewer-build: 2026-06-10-roi-v3 -->
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #16161a;
      --text: #ececf1;
      --muted: #9b9ba7;
      --accent: #5b8def;
      --border: #2a2a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(12, 12, 15, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 0.85rem; }
    select, button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    main {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: clamp(16px, 2.5vw, 32px);
    }
    section { margin-bottom: clamp(24px, 4vw, 40px); }
    h2 { font-size: clamp(1rem, 1.2vw, 1.15rem); margin: 0 0 12px; }
    #table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: clamp(0.8rem, 0.9vw, 0.9rem);
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      line-height: 1.4;
      white-space: normal;
      word-break: break-word;
    }
    th { background: var(--panel); color: var(--muted); font-weight: 500; }
    /* Keep narrow columns compact; let headline / routing breathe */
    th:nth-child(1), td:nth-child(1) { min-width: 2.5rem; white-space: nowrap; }
    th:nth-child(2), td:nth-child(2) { min-width: 7rem; }
    th:nth-child(3), td:nth-child(3) { min-width: 14rem; max-width: 28rem; }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5) { min-width: 8rem; white-space: nowrap; }
    th:nth-child(6), td:nth-child(6),
    th:nth-child(7), td:nth-child(7),
    th:nth-child(8), td:nth-child(8) { min-width: 6.5rem; white-space: nowrap; }
    th:nth-child(9), td:nth-child(9) { min-width: 16rem; max-width: 32rem; }
    th:nth-child(10), td:nth-child(10) { min-width: 10rem; max-width: 18rem; }
    .proto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: clamp(16px, 2vw, 24px);
      width: 100%;
    }
    /* Fill row width — 2 cards = 50/50, 3 = thirds */
    .proto-grid--1 { grid-template-columns: 1fr; }
    .proto-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .proto-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 960px) {
      .proto-grid--2,
      .proto-grid--3 { grid-template-columns: 1fr; }
    }
    .proto-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }
    .proto-card header {
      position: static;
      border: none;
      padding: 12px 14px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .proto-roi-section {
      padding: 0 14px 10px;
      flex-shrink: 0;
      width: 100%;
    }
    .proto-roi-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .proto-roi {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      background: rgba(91, 141, 239, 0.1);
      flex-shrink: 0;
    }
    .roi-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 10px 0 8px;
    }
    .roi-stat {
      padding: 8px 6px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      text-align: center;
    }
    .roi-stat .val {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }
    .roi-stat .lbl {
      display: block;
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    @media (max-width: 700px) {
      .roi-stats { grid-template-columns: 1fr; }
    }
    .demo-hint {
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: rgba(91, 141, 239, 0.1);
      font-size: 0.88rem;
    }
    .demo-hint a { color: var(--accent); font-weight: 600; }
    .proto-roi.roi-pursue { border-color: #22c55e55; background: rgba(34, 197, 94, 0.08); }
    .proto-roi.roi-watch { border-color: #f59e0b55; background: rgba(245, 158, 11, 0.08); }
    .proto-roi .roi-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .roi-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .roi-pursue .roi-badge { color: #4ade80; border-color: #22c55e66; }
    .roi-watch .roi-badge { color: #fbbf24; border-color: #f59e0b66; }
    .roi-lever { color: var(--muted); font-size: 0.72rem; }
    .roi-scale { color: var(--accent); font-size: 0.72rem; margin-top: 6px; }
    .roi-conf { color: var(--muted); font-size: 0.68rem; }
    .proto-preview {
      position: relative;
      cursor: pointer;
      display: flex;
      flex: 1;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      min-height: 0;
    }
    .proto-preview:hover .proto-open-hint { opacity: 1; }
    .proto-card iframe {
      width: 100%;
      flex: 0 0 auto;
      height: clamp(220px, 32vh, 340px);
      min-height: 220px;
      border: none;
      background: #fff;
      pointer-events: none;
    }
    .proto-open-hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 14px;
      background: linear-gradient(transparent, rgba(12, 12, 15, 0.92));
      color: var(--text);
      font-size: 0.8rem;
      opacity: 0.85;
      text-align: center;
    }
    .proto-card .links {
      padding: 12px 14px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: stretch;
      margin-top: auto;
    }
    .proto-card .links .btn-proto,
    .proto-card .links .btn-prd {
      flex: 1 1 auto;
      text-align: center;
      min-width: 10rem;
    }
    .btn-proto, .btn-prd {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
    }
    .btn-proto:hover, .btn-prd:hover {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.12);
    }
    .btn-prd {
      border-color: var(--accent);
      color: var(--accent);
    }
    .empty { color: var(--muted); font-style: italic; }
    .err { color: #f87171; padding: 12px; background: #1a1010; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Tracker Brief Viewer</h1>
    <span class="meta" id="run-meta">Loading…</span>
    <span class="meta" title="Hard-refresh if ROI cards missing">viewer roi-v3</span>
    <select id="run-select" aria-label="Select run"></select>
    <button type="button" id="reload-btn">Reload</button>
  </header>
  <main>
    <section id="summary-section">
      <h2>Summary</h2>
      <p id="summary-text" class="meta">—</p>
    </section>
    <section id="prototypes-section">
      <h2>Prototypes</h2>
      <div id="prototypes" class="proto-grid"></div>
    </section>
    <section id="table-section">
      <h2>Signals (full table)</h2>
      <div id="table-wrap"></div>
    </section>
  </main>
  <script>
    // viewer/ is one level below tracker-briefs/ — data + runs live under ../
    const BRIEF_PREFIX = '../';

    /** Paths in JSON are repo-relative (tracker-briefs/runs/...); resolve for viewer/. */
    function assetUrl(storedPath) {
      if (!storedPath) return '';
      const p = String(storedPath).replace(/^tracker-briefs\//, '');
      return BRIEF_PREFIX + p;
    }

    /** Full localhost URL for opening prototype / PRD in a new tab. */
    function absoluteAssetUrl(storedPath) {
      const rel = assetUrl(storedPath);
      if (!rel) return '';
      return new URL(rel, window.location.href).href;
    }

    function viewerShellUrl(shellPage, assetPath, title, extraParams) {
      const back = encodeURIComponent(window.location.href);
      const src = encodeURIComponent(assetUrl(assetPath));
      let url = `${shellPage}?src=${src}&back=${back}`;
      if (title) url += `&title=${encodeURIComponent(title)}`;
      if (extraParams) url += `&${extraParams}`;
      return url;
    }

    function qp(name) {
      return new URLSearchParams(location.search).get(name);
    }

    async function fetchJson(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`${path} → ${res.status}`);
      return res.json();
    }

    function esc(s) {
      return String(s ?? '—').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderTable(rows) {
      if (!rows.length) {
        return '<p class="empty">No signal rows.</p>';
      }
      const cols = [
        ['id', '#'],
        ['competitor', 'Competitor'],
        ['headline', 'Headline'],
        ['classification', 'Classification'],
        ['classification_detail', 'Detail'],
        ['parity_l2', 'Parity (L2)'],
        ['parity_l1', 'Parity (L1)'],
        ['routing', 'Routing'],
        ['why_routing', 'Why / routing'],
        ['source_url', 'Source'],
      ];
      const head = cols.map(([, label]) => `<th>${esc(label)}</th>`).join('');
      const body = rows.map((r) => {
        const cells = cols.map(([key]) => {
          let v = r[key];
          if (key === 'classification' && r.classification_detail) {
            v = `${r.classification} / ${r.classification_detail}`;
          }
          if (key === 'classification_detail') return '';
          if (key === 'source_url' && v) {
            return `<td><a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a></td>`;
          }
          return `<td>${esc(v)}</td>`;
        }).filter(Boolean).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function renderRoiBlock(roi) {
      if (!roi) return '';
      const verdict = (roi.verdict || 'modeled').toLowerCase();
      const cls = verdict === 'pursue' ? 'roi-pursue' : verdict === 'watch' ? 'roi-watch' : 'roi-neutral';
      const stats = [
        ['Per unit', roi.per_unit_annual],
        ['250 units', roi.property_250],
        ['10k portfolio', roi.portfolio_10k],
      ].filter(([, v]) => v);
      const statsHtml = stats.length
        ? `<div class="roi-stats">${stats.map(([lbl, val]) =>
            `<div class="roi-stat"><span class="val">${esc(val)}</span><span class="lbl">${esc(lbl)}</span></div>`
          ).join('')}</div>`
        : '';
      return `
        <div class="proto-roi ${cls}">
          <div class="roi-head">
            <span class="roi-badge">${esc((roi.verdict || 'ROI').toUpperCase())}</span>
            <span class="roi-lever">${esc(roi.lever || 'ROI lever')}</span>
          </div>
          ${statsHtml}
          <div>${esc(roi.summary || 'ROI summary pending publish.')}</div>
          <div class="roi-conf">${esc(roi.confidence || 'modeled')} · roi-analyst</div>
        </div>`;
    }

    function renderPrototypes(protos, manifest) {
      const el = document.getElementById('prototypes');
      if (!protos.length) {
        const isPmm = (manifest?.product_row_count ?? manifest?.prototype_count ?? 0) === 0;
        el.innerHTML = `
          <p class="empty">No prototypes this run${isPmm ? ' (PMM-only day)' : ''}.</p>
          <p class="demo-hint">
            Prototypes and <strong>ROI</strong> appear on Product signal days.
            <a href="?run=_sample-product-day">Open Product-day demo</a> to preview what Billy sees when there are Tier — Now Product rows.
          </p>`;
        return;
      }
      el.className = 'proto-grid';
      if (protos.length >= 1 && protos.length <= 3) {
        el.classList.add(`proto-grid--${protos.length}`);
      }
      el.innerHTML = protos.map((p) => {
        const htmlPath = p.preview_path || p.html_path || '';
        const src = assetUrl(htmlPath);
        const protoShell = viewerShellUrl('prototype.html', htmlPath, p.title);
        const prdShell = p.prd_path ? viewerShellUrl('prd.html', p.prd_path, null, 'auto=pdf') : '';
        return `
          <article class="proto-card">
            <header>
              <strong>${esc(p.title)}</strong>
              <span class="meta">${esc(p.competitor || p.competitor_id)}</span>
            </header>
            <div class="proto-roi-section">
              <div class="proto-roi-label">ROI snapshot</div>
              ${renderRoiBlock(p.roi)}
            </div>
            <a class="proto-preview" href="${esc(protoShell)}" target="_blank" rel="noopener" title="Open prototype full screen">
              <iframe src="${esc(src)}?v=3" title="${esc(p.title)}" loading="lazy"></iframe>
              <span class="proto-open-hint">Click to open prototype full screen</span>
            </a>
            <div class="links">
              <a class="btn-proto" href="${esc(protoShell)}" target="_blank" rel="noopener">Open prototype</a>
              ${prdShell ? `<a class="btn-prd" href="${esc(prdShell)}" target="_blank" rel="noopener">Download complete PRD now</a>` : ''}
            </div>
          </article>`;
      }).join('');
    }

    async function loadRun(runId) {
      const base = `${BRIEF_PREFIX}runs/${runId}/`;
      const [manifest, table, protos] = await Promise.all([
        fetchJson(base + 'manifest.json'),
        fetchJson(base + 'signals-table.json'),
        fetchJson(base + 'prototypes.json').catch(() => []),
      ]);

      document.getElementById('run-meta').textContent =
        `${manifest.run_id} · ${manifest.net_new_count ?? 0} net-new · ${manifest.prototype_count ?? 0} prototypes`;
      document.getElementById('summary-text').textContent =
        manifest.summary || '(no summary)';
      document.getElementById('table-wrap').innerHTML = renderTable(table);
      renderPrototypes(protos, manifest);
    }

    async function init() {
      try {
        const latest = await fetchJson(BRIEF_PREFIX + 'latest.json');
        const runParam = qp('run') || latest.run_id;
        const select = document.getElementById('run-select');
        let runs = [];
        try {
          const idx = await fetchJson(BRIEF_PREFIX + 'runs-index.json');
          runs = idx.runs || [];
        } catch {
          runs = [{ run_id: runParam }];
        }
        if (!runs.some((r) => r.run_id === runParam)) {
          runs.unshift({ run_id: runParam, net_new_count: latest.net_new_count, prototype_count: latest.prototype_count });
        }
        select.innerHTML = runs.map((r) => {
          const label = r.fixture ? `${r.run_id} (demo)` : r.run_id;
          const meta = `${r.net_new_count ?? '?'} net-new · ${r.prototype_count ?? 0} proto`;
          return `<option value="${esc(r.run_id)}"${r.run_id === runParam ? ' selected' : ''}>${esc(label)} — ${esc(meta)}</option>`;
        }).join('');
        select.onchange = () => {
          const id = select.value;
          const url = new URL(location.href);
          url.searchParams.set('run', id);
          history.replaceState(null, '', url);
          loadRun(id);
        };
        await loadRun(runParam);
        document.getElementById('reload-btn').onclick = () => loadRun(select.value || runParam);
      } catch (err) {
        document.getElementById('summary-text').innerHTML =
          `<span class="err">Failed to load brief: ${esc(err.message)}. Start <code>python3 -m http.server 8765</code> from repo root, then Simple Browser → <code>http://localhost:8765/tracker-briefs/viewer/index.html</code> (not the editor tab).</span>`;
      }
    }

    init();
  </script>
</body>
</html>
