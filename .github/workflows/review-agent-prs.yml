# Virtual me: on PRs from agent/*, run tests and comment Accept or Deny. Never merges.

name: Review agent PRs

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize]

jobs:
  virtual-me:
    name: Virtual me (tests + Accept/Deny)
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'agent/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tracker deps
        run: |
          if [ -f initiative-1-tracker/tracker/package.json ]; then
            cd initiative-1-tracker/tracker && npm install
          fi

      - name: Tracker smoke
        run: |
          cd initiative-1-tracker/tracker && node index.js
          test "$(node index.js)" = "Tracker"
        id: smoke

      - name: Tracker test
        run: cd initiative-1-tracker/tracker && node test/run.js
        id: test

      - name: Comment Accept
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**Virtual me: Accept** (tests pass). You can merge when ready.'
            })

      - name: Comment Deny
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**Virtual me: Deny** (tests failed). Fix and push or close the PR.'
            })
